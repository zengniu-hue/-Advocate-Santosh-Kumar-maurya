<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Santosh Kumar Maurya</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --navy:#0b1420;
      --gold:#c9a45c;
      --cream:#f7f3eb;
      --white:#fff;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:var(--cream);
      color:#18222d;
    }

    .header{
      background:var(--navy);
      color:white;
      padding:25px 20px;
      text-align:center;
    }

    .header h1{
      font-family:Georgia,serif;
      font-size:28px;
    }

    .header p{
      color:#c9a45c;
      margin-top:6px;
      font-size:13px;
    }

    .container{
      width:min(700px,92%);
      margin:45px auto;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:8px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    .card h2{
      font-family:Georgia,serif;
      color:var(--navy);
      margin-bottom:8px;
    }

    .card p{
      color:#68727c;
      font-size:14px;
      margin-bottom:25px;
    }

    label{
      display:block;
      font-size:12px;
      font-weight:bold;
      margin-bottom:8px;
      color:#59636d;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:5px;
      margin-bottom:18px;
      font-size:14px;
    }

    button{
      width:100%;
      padding:14px;
      border:0;
      border-radius:5px;
      background:var(--gold);
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:.9;
    }

    #message{
      margin-top:15px;
      font-size:13px;
      text-align:center;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Santosh Kumar Maurya</h1>
    <p>Private Admin Panel</p>
  </div>

  <main class="container">

    <div class="card">
      <h2>Admin Login</h2>
      <p>Sign in to manage website content.</p>

      <form id="login-form">

        <label>Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter email"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >

        <button type="submit">LOGIN</button>

      </form>

      <div id="message"></div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://sbwgzaevcgcdcqycsuhh.supabase.co";

    const SUPABASE_KEY = "sb_publishable_RmV8sz1RQjrN3jv1pq04Ig_1OfTGkZ5";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event){

      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      message.textContent = "Logging in...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if(error){
        message.textContent = error.message;
        return;
      }

      message.textContent = "Login successful!";
      
      console.log("Logged in:", data.user);

    });
  </script>

</body>
</html>
