<!DOCTYPE html>
<html lang="en">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Santosh Kumar Maurya</title>

  <style>
    :root{
      --navy:#0b1420;
      --gold:#c9a45c;
      --cream:#f7f3eb;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:var(--cream);
      color:#18222d;
    }

    header{
      background:var(--navy);
      color:white;
      padding:28px 20px;
      text-align:center;
    }

    header h1{
      font-family:Georgia,serif;
      font-size:28px;
    }

    .admin-subtitle{
  color:var(--gold);
  margin-top:6px;
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
    }

    main{
      width:min(700px,92%);
      margin:45px auto;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:8px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h2{
      font-family:Georgia,serif;
      color:var(--navy);
      margin-bottom:8px;
    }

    .intro{
      color:#68727c;
      font-size:14px;
      margin-bottom:25px;
    }

    label{
      display:block;
      font-size:12px;
      font-weight:bold;
      color:#59636d;
      margin-bottom:8px;
    }

    textarea{
      width:100%;
      padding:14px;
      border:1px solid #ddd;
      border-radius:5px;
      font-size:15px;
      font-family:Arial,sans-serif;
      margin-bottom:18px;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:0;
      border-radius:5px;
      background:var(--gold);
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    #message{
      margin-top:15px;
      text-align:center;
      font-size:13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Santosh Kumar Maurya</h1>
    <div class="admin-subtitle">PRIVATE ADMIN DASHBOARD</div>
    <style>
#logout-btn{
  margin-top:18px;
  padding:10px 22px;
  border:1px solid rgba(201,164,92,.6);
  border-radius:6px;
  background:transparent;
  color:#c9a45c;
  font-size:12px;
  font-weight:600;
  letter-spacing:1.5px;
  cursor:pointer;
}

#logout-btn:hover{
  background:#c9a45c;
  color:#07101a;
}
    </style>
    <button id="logout-btn">Logout</button>
  </header>

  <main>

    <div class="card">

      <h2>शुभ विचार</h2>

      <p class="intro">
        यहाँ से वेबसाइट पर दिखाई देने वाला शुभ विचार बदला जा सकेगा।
      </p>

      <label for="shubh-vichar">
        अपना शुभ विचार लिखें
      </label>

      <textarea
        id="shubh-vichar"
        placeholder="यहाँ अपना शुभ विचार लिखें..."
      ></textarea>

      <button type="button" id="save-btn">
        SAVE SHUBH VICHAR
      </button>

      <div id="message"></div>

    </div>
    <div class="card">

  <h2>Add New Property</h2>

  <p class="intro">
    यहाँ से वेबसाइट पर नई property जोड़ी जा सकेगी।
  </p>

  <label>Property Title</label>
  <input id="property-title" type="text" placeholder="e.g. Luxury 3BHK Apartment">

  <label>Property Type</label>
  <input id="property-type" type="text" placeholder="e.g. Apartment, Villa, Plot">

  <label>Price</label>
  <input id="property-price" type="text" placeholder="e.g. ₹65 Lakh">

  <label>Location</label>
  <input id="property-location" type="text" placeholder="e.g. Bhadohi, Uttar Pradesh">

  <label>Bedrooms</label>
  <input id="property-bedrooms" type="number" placeholder="3">

  <label>Bathrooms</label>
  <input id="property-bathrooms" type="number" placeholder="2">

  <label>Area</label>
  <input id="property-area" type="text" placeholder="e.g. 1800 sq.ft">

  <label>Description</label>
  <textarea id="property-description" placeholder="Describe the property..."></textarea>

  <label>Facilities</label>
  <textarea id="property-facilities" placeholder="Parking, Garden, Security..."></textarea>

  <label>Distance from Main Road</label>
  <input id="property-road" type="text" placeholder="e.g. 500 meters">

  <label>Image URL</label>
  <input id="property-image" type="url" placeholder="Paste property image URL">

  <button type="button" id="add-property-btn">
    ADD PROPERTY
  </button>

  <div id="property-message"></div>

    </div>
<div class="card">

  <h2>Manage Properties</h2>

  <p class="intro">
    यहाँ से existing properties को edit या delete किया जा सकेगा।
  </p>

  <div id="properties-list"></div>

</div>
    
  </main>
<script>
const SUPABASE_URL = "https://sbwgzaevcgcdcqycsuhh.supabase.co";
const SUPABASE_KEY = "sb_publishable_RmV8sz1RQjrN3jv1pq04Ig_1OfTGkZ5";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  supabaseClient.auth.getSession().then(({ data }) => {
  if (!data.session) {
    window.location.href = "Admin.html";
  }
});
</script>
  <script>
    async function loadShubhVichar() {
  const { data, error } = await supabaseClient
    .from("Shubh Vichar")
    .select("Content")
    .order("id", { ascending: false })
    .limit(1)
    .single();

  if (error) {
    console.error(error);
    return;
  }

  if (data) {
    document.getElementById("shubh-vichar").value = data.Content;
  }
}

loadShubhVichar();
    document.getElementById("logout-btn").addEventListener("click", async function(){
  await supabaseClient.auth.signOut();
  window.location.href = "Admin.html";
});
document.getElementById("save-btn").addEventListener("click", async function(){

  const content = document.getElementById("shubh-vichar").value.trim();
  const message = document.getElementById("message");

  if(!content){
    message.textContent = "Please write a Shubh Vichar first.";
    return;
  }

  message.textContent = "Saving...";

  
const { data, error } = await supabaseClient
  .from("Shubh Vichar")
  .select("id")
  .order("id", { ascending: false })
  .limit(1)
  .single();

if (!error && data) {
  const { error: updateError } = await supabaseClient
    .from("Shubh Vichar")
    .update({ Content: content })
    .eq("id", data.id);

  if (updateError) {
    console.error(updateError);
    message.textContent = "Error: " + updateError.message;
    return;
  }
}
  if(error){
    console.error(error);
    message.textContent = "Error: " + error.message;
    return;
  }

  message.textContent = "Shubh Vichar saved successfully!";
  document.getElementById("shubh-vichar").value = "";

});
   let editingPropertyId = null;
 document.getElementById("add-property-btn").addEventListener("click", async function(){

  const property = {
    Title: document.getElementById("property-title").value.trim(),
    "Property type": document.getElementById("property-type").value.trim(),
    Price: document.getElementById("property-price").value.trim(),
    Location: document.getElementById("property-location").value.trim(),
    Bedrooms: document.getElementById("property-bedrooms").value,
    Bathrooms: document.getElementById("property-bathrooms").value,
    Area: document.getElementById("property-area").value.trim(),
    Description: document.getElementById("property-description").value.trim(),
    Facilities: document.getElementById("property-facilities").value.trim(),
    "Distance from main road": document.getElementById("property-road").value.trim(),
    "Image URL": document.getElementById("property-image").value.trim()
  };

  const propertyMessage = document.getElementById("property-message");

  propertyMessage.textContent = "Saving property...";

  if (editingPropertyId) {

  const { error } = await supabaseClient
    .from("Properties")
    .update(property)
    .eq("id", editingPropertyId);

  if (error) {
    console.error(error);
    propertyMessage.textContent = "Error: " + error.message;
    return;
  }

  propertyMessage.textContent = "Property updated successfully!";
  editingPropertyId = null;
  loadManageProperties();
  return;

}

const { error } = await supabaseClient
  .from("Properties")
  .insert([property]);

  if(error){
    console.error(error);
    propertyMessage.textContent = "Error: " + error.message;
    return;
  }

  propertyMessage.textContent = "Property added successfully!";

});
  async function loadManageProperties() {

  const { data, error } = await supabaseClient
    .from("Properties")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.error(error);
    document.getElementById("properties-list").textContent =
      "Error loading properties: " + error.message;
    return;
  }

  const list = document.getElementById("properties-list");

  if (!data || data.length === 0) {
    list.textContent = "No properties added yet.";
    return;
  }

  list.innerHTML = "";
window.propertiesData = data;
  data.forEach(property => {

    const item = document.createElement("div");

    item.style.padding = "18px";
    item.style.marginBottom = "15px";
    item.style.border = "1px solid #ddd";
    item.style.borderRadius = "6px";

    item.innerHTML = `
      <h3>${property["Title"] || "Untitled Property"}</h3>
      <p>${property["Location"] || ""}</p>
      <p>${property["Price"] || ""}</p>
      <button type="button" class="edit-property-btn" data-id="${property["id"]}">EDIT</button>
      <button type="button" class="delete-property-btn" data-id="${property["id"]}">DELETE</button>
    `;

    list.appendChild(item);
  });
}
document.addEventListener("click", function(event) {

  if (event.target.classList.contains("edit-property-btn")) {

    const propertyId = event.target.dataset.id;
    editingPropertyId = propertyId;
    document.getElementById("add-property-btn").textContent = "UPDATE PROPERTY";

    const property = window.propertiesData.find(
      item => String(item.id) === String(propertyId)
    );

    if (!property) return;

    document.getElementById("property-title").value = property["Title"] || "";
    document.getElementById("property-type").value = property["Property type"] || "";
    document.getElementById("property-price").value = property["Price"] || "";
    document.getElementById("property-location").value = property["Location"] || "";
    document.getElementById("property-bedrooms").value = property["Bedrooms"] || "";
    document.getElementById("property-bathrooms").value = property["Bathrooms"] || "";
    document.getElementById("property-area").value = property["Area"] || "";
    document.getElementById("property-description").value = property["Description"] || "";
    document.getElementById("property-facilities").value = property["Facilities"] || "";
    document.getElementById("property-road").value = property["Distance from main road"] || "";
    document.getElementById("property-image").value = property["Image URL"] || "";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

});
loadManageProperties();  
</script>
</body>
  
</html>
